spring.application.name=fasohoops-api
server.port=${PORT:8080}

# Database Configuration (Supporte PostgreSQL en production ou H2 en local par défaut)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fasohoops_db;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (Dialecte détecté automatiquement par Spring Boot selon la BDD)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=false

# Configuration Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Spring Security Default User
spring.security.user.name=admin
spring.security.user.password=admin123

# Clé secrète pour signer les JWT
app.jwt.secret=${JWT_SECRET:KhzpYgnjK4JibauAYChjTJKKBNQsjPW28y4RvRxGpafKM8ekAnez+/AOXPXZg6gzF8ajxEhJIT2p+wFyZf3WPg==}
app.jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.security=INFO
logging.level.bf.fasohoops=INFO

# CinetPay Payment Configuration (avec valeurs par défaut)
cinetpay.apikey=${CINETPAY_API_KEY:test_cinetpay_api_key}
cinetpay.siteid=${CINETPAY_SITE_ID:test_cinetpay_site_id}
cinetpay.notify-url=${CINETPAY_NOTIFY_URL:https://fasohoops.bf/api/paiement/webhook}
cinetpay.return-url=${CINETPAY_RETURN_URL:http://localhost:3000/abonnements/succes}
