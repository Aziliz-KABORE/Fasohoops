spring.application.name=fasohoops-api
server.port=8080

# Database Configuration (H2 File-based persistent storage in backend/data/)
spring.datasource.url=jdbc:h2:file:./data/fasohoops_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Liquibase
spring.liquibase.enabled=false

# Configuration Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

# Spring Security Default User
spring.security.user.name=admin
spring.security.user.password=admin123

# Clé secrète pour signer les JWT
app.jwt.secret=${JWT_SECRET:KhzpYgnjK4JibauAYChjTJKKBNQsjPW28y4RvRxGpafKM8ekAnez+/AOXPXZg6gzF8ajxEhJIT2p+wFyZf3WPg==}
app.jwt.expiration-ms=86400000

# Logs
logging.level.org.springframework.security=INFO
logging.level.bf.fasohoops=INFO

# CinetPay Payment Configuration (avec valeurs par défaut de développement)
cinetpay.apikey=${CINETPAY_API_KEY:test_cinetpay_api_key}
cinetpay.siteid=${CINETPAY_SITE_ID:test_cinetpay_site_id}
cinetpay.notify-url=https://fasohoops.bf/api/paiement/webhook
cinetpay.return-url=http://localhost:3000/abonnements/succes
