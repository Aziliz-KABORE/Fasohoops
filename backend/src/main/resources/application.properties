spring.application.name=fasohoops-api
server.port=8080

# Database Configuration (Development H2 / PostgreSQL ready)
spring.datasource.url=jdbc:h2:mem:fasohoops_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable Liquibase if needed
spring.liquibase.enabled=false
